# ─── Server ────────────────────────────────────────────────────────────────
server.port=8000

# ─── DataSource (SQLite) ────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:./vengai.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ─── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Jackson ───────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ─── CORS origins (comma-separated) ─────────────────────────────────────────
app.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174

# ─── ThingSpeak ─────────────────────────────────────────────────────────────
thingspeak.channel-id=3479203
thingspeak.read-api-key=MQYIRTLMQ15XVKKF
thingspeak.base-url=https://api.thingspeak.com

# ─── OpenWeather ─────────────────────────────────────────────────────────────
weather.api-key=
weather.location=Chennai,IN
weather.base-url=https://api.openweathermap.org/data/2.5

# ─── Device settings ─────────────────────────────────────────────────────────
device.offline-timeout-seconds=300

# ─── ML Service (Python Random Forest Models) ────────────────────────────────
ml.service.url=http://localhost:5001

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.vengai=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} | %-5level | %logger{36} | %msg%n

